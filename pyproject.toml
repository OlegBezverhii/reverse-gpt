[project]
name = "reverse-gpt"
version = "0.1.0"
description = "AI agent for reverse engineering assistance using LangGraph and Groq (Kimi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyhidra>=1.3.0",
]

[tool.setuptools]
packages = ["src"]
